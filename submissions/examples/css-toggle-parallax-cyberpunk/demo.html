<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Parallax Toggle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <label class="cyber-px-toggle">
        <input type="checkbox">
        <div class="cp-track">
            <span class="cp-label cp-off">SYS_OFF</span>
            <span class="cp-label cp-on">SYS_ON</span>
            <div class="cp-thumb"></div>
        </div>
    </label>
</body>
</html>
