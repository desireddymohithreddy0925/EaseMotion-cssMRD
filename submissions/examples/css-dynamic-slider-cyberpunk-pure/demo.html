<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Dynamic Slider</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

    <div class="cyberpunk-container">
        <!-- Glitch Overlay -->
        <div class="glitch-overlay"></div>
        
        <div class="slider-wrapper">
            <div class="cyber-label">
                <span class="cyber-text">SYS.OVERRIDE</span>
                <span class="cyber-value">[ // STATUS: ACTIVE ]</span>
            </div>
            
            <div class="slider-track-container">
                <input type="range" min="0" max="100" value="75" class="cyber-slider" id="cyber-slider" aria-label="System Override Level">
                
                <!-- Pure CSS value tooltip logic based on slider value is tricky without JS, 
                     but we can style the track and thumb highly dynamically -->
                <div class="cyber-slider-glow"></div>
            </div>
            
            <div class="cyber-decorative-bars">
                <div class="bar bar-1"></div>
                <div class="bar bar-2"></div>
                <div class="bar bar-3"></div>
                <div class="bar bar-4"></div>
                <div class="bar bar-5"></div>
            </div>
        </div>
    </div>

</body>
</html>
