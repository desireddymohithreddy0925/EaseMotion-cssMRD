<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hover Pagination - Dark Mode</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="pagination-container">
    <nav class="pagination" aria-label="Pagination Navigation">
      <a href="#" class="page-link prev" aria-label="Previous page">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </a>
      <a href="#" class="page-link"><span>1</span></a>
      <a href="#" class="page-link active" aria-current="page"><span>2</span></a>
      <a href="#" class="page-link"><span>3</span></a>
      <span class="page-dots">...</span>
      <a href="#" class="page-link"><span>8</span></a>
      <a href="#" class="page-link"><span>9</span></a>
      <a href="#" class="page-link next" aria-label="Next page">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </a>
    </nav>
  </div>
</body>
</html>
